name: Promote Snag stable
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node --check app.js && node --check cloudflare-worker.js && node --check release.js && node release-check.mjs
      - run: git push origin HEAD:stable --force-with-lease
