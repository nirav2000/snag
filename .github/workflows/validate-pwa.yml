name: Validate shared PWA adoption

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - ".github/workflows/validate-pwa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PWA adoption
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','manifest.webmanifest','sw.js'])if(!fs.existsSync(file))throw new Error('Missing '+file);
          const html=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(manifest.display!=='standalone')throw new Error('manifest display must be standalone');
          if(!manifest.start_url)throw new Error('manifest missing start_url');
          if(!(manifest.icons||[]).length)throw new Error('manifest missing install icon');
          if(!html.includes('rel="manifest"'))throw new Error('index.html missing manifest link');
          if(!html.includes('Apps/pwa/v1/index.js'))throw new Error('index.html missing shared PWA bootstrap');
          if(!sw.includes('Apps/pwa/v1/service-worker.js'))throw new Error('sw.js missing shared PWA worker import');
          for(const icon of manifest.icons||[]){
            if(/^https?:/.test(icon.src)||icon.src.startsWith('/'))continue;
            if(!fs.existsSync(icon.src.replace(/^\.\//,'')))throw new Error('Missing icon '+icon.src);
          }
          console.log('Shared PWA adoption is valid.');
          NODE
