name: Deploy shared Pronunciation worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-shared-pronunciation.yml"
  schedule:
    - cron: "29 * * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared Apps source
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy shared pronunciation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-pronunciation.jsonc
      - name: Check OpenAI credential
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured in the Snag credential-host repository. Generated pronunciation will fall back to the device voice until it is added."
          fi
      - name: Configure OpenAI Worker secret
        if: steps.openai.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY -c wrangler-pronunciation.jsonc
      - name: Verify worker
        run: |
          curl --fail --silent --show-error 'https://apps-pronunciation-api.nirav2000-github.workers.dev/health'
          echo
