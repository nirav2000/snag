name: Test Snag tenancy rules
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "security-tests.mjs"
      - ".github/workflows/security-tests.yml"
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-save firebase@12.2.1 @firebase/rules-unit-testing firebase-tools
      - run: npx firebase emulators:exec --only firestore --project demo-snag-rules "node security-tests.mjs"
