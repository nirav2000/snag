name: Deploy shared App Monitor worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-shared-app-monitor.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared Apps source
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare source and deployed Worker builds
        id: compare
        run: |
          SOURCE_BUILD="$(node -e "const fs=require('fs');const s=fs.readFileSync('app-monitor-worker.js','utf8');const m=s.match(/WORKER_BUILD='([^']+)'/);if(!m)process.exit(2);process.stdout.write(m[1])")"
          LIVE_BUILD="$(curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).build||'')}catch{}})")"
          echo "source=$SOURCE_BUILD" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE_BUILD" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_BUILD" = "$LIVE_BUILD" ]; then echo "deploy=false" >> "$GITHUB_OUTPUT"; else echo "deploy=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.compare.outputs.deploy == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy shared Worker
        if: steps.compare.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-app-monitor.jsonc
      - name: Verify developer control API
        if: steps.compare.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health'
          echo
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/developer-config?app=Snag'
          echo
