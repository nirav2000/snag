name: Deploy shared App Monitor worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-shared-app-monitor.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared Apps source
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare source and deployed Worker revisions
        id: compare
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          LIVE_SHA="$(curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sourceSha||'')}catch{}})")"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_SHA" = "$LIVE_SHA" ]; then echo "deploy=false" >> "$GITHUB_OUTPUT"; else echo "deploy=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create deployment config with source SHA
        if: steps.compare.outputs.deploy == 'true'
        env:
          SOURCE_SHA: ${{ steps.compare.outputs.source }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler-app-monitor.jsonc','utf8'));
          cfg.vars={...(cfg.vars||{}),APP_MONITOR_SOURCE_SHA:process.env.SOURCE_SHA};
          fs.writeFileSync('wrangler-app-monitor.generated.jsonc',JSON.stringify(cfg,null,2));
          NODE

      - name: Deploy shared Worker
        if: steps.compare.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-app-monitor.generated.jsonc

      - name: Sync notification provider secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID || secrets.FCM_PROJECT_ID }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
          FCM_WEB_API_KEY: ${{ vars.FCM_WEB_API_KEY || secrets.FCM_WEB_API_KEY }}
          FCM_WEB_APP_ID: ${{ vars.FCM_WEB_APP_ID || secrets.FCM_WEB_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ vars.FCM_MESSAGING_SENDER_ID || secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_VAPID_KEY: ${{ vars.FCM_VAPID_KEY || secrets.FCM_VAPID_KEY }}
          FCM_AUTH_DOMAIN: ${{ vars.FCM_AUTH_DOMAIN || secrets.FCM_AUTH_DOMAIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SIGNAL_WEBHOOK_URL: ${{ secrets.SIGNAL_WEBHOOK_URL }}
          NOTIFICATION_INGEST_KEY: ${{ secrets.NOTIFICATION_INGEST_KEY }}
        run: |
          sync_secret() {
            NAME="$1"
            VALUE="$(printenv "$NAME" || true)"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" --name apps-monitor-api
              echo "Synced $NAME"
            else
              echo "Skipped $NAME (not configured in Snag Actions secrets)"
            fi
          }
          for NAME in             FCM_PROJECT_ID FCM_CLIENT_EMAIL FCM_PRIVATE_KEY FCM_WEB_API_KEY FCM_WEB_APP_ID FCM_MESSAGING_SENDER_ID FCM_VAPID_KEY FCM_AUTH_DOMAIN             RESEND_API_KEY NOTIFICATION_FROM_EMAIL             TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID             TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_SMS_FROM TWILIO_WHATSAPP_FROM             SLACK_WEBHOOK_URL DISCORD_WEBHOOK_URL SIGNAL_WEBHOOK_URL NOTIFICATION_INGEST_KEY
          do
            sync_secret "$NAME"
          done
      - name: Verify developer control API
        if: steps.compare.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health'
          echo
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/developer-config?app=Snag'
          echo

      - name: Verify consumer notification registry
        run: |
          BODY="$(curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/notifications/public-config?app=openday')"
          echo "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.consumerRegistration!==true) process.exit(1)' "$BODY"
          CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://nirav2000.github.io' -H 'Content-Type: application/json' --data '{"app":"openday","notification":{"title":"probe"}}' 'https://apps-monitor-api.nirav2000-github.workers.dev/notifications/consumer/deliver')"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected protected consumer delivery route to require bridge authentication (401), got $CODE"
            exit 1
          fi

      - name: Verify notification route exists
        run: |
          CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/notifications/state')"
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected App Monitor notification route to exist and require authentication (401), got $CODE"
            exit 1
          fi

      - name: Verify deployed source SHA
        run: |
          SOURCE_SHA="${{ steps.compare.outputs.source }}"
          LIVE_SHA="$(curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sourceSha||'')}catch{}})")"
          if [ "$SOURCE_SHA" != "$LIVE_SHA" ]; then
            echo "::error::Live App Monitor Worker source SHA does not match Apps/main. source=$SOURCE_SHA live=$LIVE_SHA"
            exit 1
          fi
