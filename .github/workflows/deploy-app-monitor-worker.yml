# Do not restore scheduling, deploy, or "wrangler secret put" from Snag.
name: Retired App Monitor - deploy-app-monitor-worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the safety lock
        run: |
          echo "::error::This legacy Snag-to-AppMonitor deployment is disabled to prevent passkey outages."
          echo "Use nirav2000/Apps .github/workflows/deploy-app-monitor-worker.yml for staged deployment."
          echo "For notifications provider updates, add a reviewed, version-preserving secret change in the Apps release pipeline; never change apps-monitor-api from Snag."
          exit 1
