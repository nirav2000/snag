name: Deploy dedicated App Monitor worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-app-monitor-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Apps platform
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          path: apps-monitor

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps-monitor/package.json

      - name: Install worker dependencies
        working-directory: apps-monitor
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure dedicated R2 bucket exists
        working-directory: apps-monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create apps-monitor-data || npx wrangler r2 bucket info apps-monitor-data

      - name: Deploy dedicated App Monitor worker
        working-directory: apps-monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-app-monitor.jsonc

      - name: Configure one-time migration authorization
        working-directory: apps-monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MIGRATION_TOKEN="$(openssl rand -hex 32)"
          printf '%s' "$MIGRATION_TOKEN" > /tmp/app-monitor-migration-token
          printf '%s' "$MIGRATION_TOKEN" | npx wrangler secret put MIGRATION_TOKEN -c wrangler-app-monitor.jsonc

      - name: Wait for dedicated Worker propagation
        env:
          APP_MONITOR_URL: https://apps-monitor-api.nirav2000-github.workers.dev
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$APP_MONITOR_URL/health" >/tmp/app-monitor-health; then
              cat /tmp/app-monitor-health
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::Dedicated App Monitor Worker did not become reachable"
          exit 1

      - name: Copy App Monitor data from Snag R2
        env:
          APP_MONITOR_URL: https://apps-monitor-api.nirav2000-github.workers.dev
        run: |
          MIGRATION_TOKEN="$(cat /tmp/app-monitor-migration-token)"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -X POST \
            -H "X-Migration-Token: $MIGRATION_TOKEN" \
            "$APP_MONITOR_URL/migration/copy"
          echo
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -H "X-Migration-Token: $MIGRATION_TOKEN" \
            "$APP_MONITOR_URL/migration/status"
          echo

      - name: Smoke-test dedicated service
        env:
          APP_MONITOR_URL: https://apps-monitor-api.nirav2000-github.workers.dev
        run: |
          curl --fail --silent --show-error "$APP_MONITOR_URL/health"
          echo
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' "$APP_MONITOR_URL/app-monitor/security/status"
          echo
