name: Deploy Warranty Ease private R2 API
on:
  push:
    branches: [main]
    paths:
      - warranty-ease-worker.js
      - wrangler-warranty-ease.jsonc
      - .github/workflows/deploy-warranty-ease-worker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-warranty-ease-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate worker source and Cloudflare configuration
        run: |
          node --check warranty-ease-worker.js
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("wrangler-warranty-ease.jsonc","utf8"));if(x.name!=="warranty-ease-api"||x.r2_buckets?.[0]?.bucket_name!=="warranty-ease-private"||!x.services?.some(y=>y.binding==="APP_MONITOR_AUTH"&&y.service==="apps-monitor-api"))throw Error("Worker config missing isolated storage or internal App Monitor auth service binding")'
      - name: Test owner authentication, incremental records and legacy archives
        run: node --test warranty-ease-worker.test.mjs
      - name: Ensure existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler-warranty-ease.jsonc
      - name: Verify public health and private access boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://warranty-ease-api.nirav2000-github.workers.dev'
          # Newly deployed workers.dev routes can take time to become visible at the edge.
          for attempt in $(seq 1 15); do
            status=$(curl --silent --show-error -o /tmp/warranty-health.json -w '%{http_code}' "$ROOT/v1/health" || true)
            if [[ "$status" == 200 ]] && grep -q '"incrementalSync":true' /tmp/warranty-health.json; then break; fi
            echo "Worker health not yet ready (attempt $attempt/15, HTTP $status)"
            if [[ "$attempt" == 15 ]]; then
              echo "::error::Worker health never became ready"
              head -c 250 /tmp/warranty-health.json || true
              exit 1
            fi
            sleep 6
          done
          for resource in /v1/backups /v2/migration /v2/records; do
            code=$(curl --silent --show-error -o /tmp/warranty-unauth.json -w '%{http_code}' "$ROOT$resource")
            test "$code" = 401 || { echo "::error::Unauthenticated $resource access returned $code"; exit 1; }
          done
          echo 'Worker deployed and unauthenticated access denied.'
