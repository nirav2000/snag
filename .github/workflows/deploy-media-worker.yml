name: Deploy Snag media worker

on:
  workflow_dispatch:
    inputs:
      app_monitor_setup_request:
        description: "Optional App Monitor first-use setup request ID to approve"
        required: false
        type: string
  push:
    branches: ["main"]
    paths:
      - "cloudflare-worker.js"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-media-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Wrangler
        run: npm install
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Approve App Monitor first-use setup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.app_monitor_setup_request != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUEST_ID: ${{ inputs.app_monitor_setup_request }}
        run: |
          case "$REQUEST_ID" in (*[!A-Za-z0-9_-]*|'') echo "::error::Invalid setup request ID"; exit 1;; esac
          printf '{"approved":true,"approvedAt":"%s","approvedBy":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_ACTOR" | npx wrangler r2 object put "snag-media/_app-monitor/v2/security/bootstrap-approvals/$REQUEST_ID.json" --pipe --remote --content-type application/json --force
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke-test App Monitor auth endpoints
        run: |
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://snag-media-api.nirav2000-github.workers.dev/app-monitor/health'
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://snag-media-api.nirav2000-github.workers.dev/app-monitor/security/status'
          SETUP_SECRET="$(openssl rand -hex 32)"
          curl --fail --silent --show-error \
            -H 'Origin: https://nirav2000.github.io' \
            -H 'Content-Type: application/json' \
            --data "{\"secret\":\"$SETUP_SECRET\"}" \
            'https://snag-media-api.nirav2000-github.workers.dev/app-monitor/bootstrap/request'
