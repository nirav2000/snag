name: Validate Snag app

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "firebase-config.js"
      - "legacy-bridge.html"
      - "version-lab.html"
      - "firestore.rules"
      - "cloudflare-worker.js"
      - "firebase-messaging-sw.js"
      - "release.js"
      - "snag-export.js"
      - "snag-export-ui.js"
      - "snag-bulk.mjs"
      - "snag-bulk.test.mjs"
      - "welcome.html"
      - "privacy.html"
      - "terms.html"
      - "release-check.mjs"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check notes.js
          node --check cloudflare-worker.js
          node --check release.js
          node --check snag-export.js
          node --check snag-export-ui.js
          node --check snag-bulk.mjs
          node --test snag-bulk.test.mjs
          node release-check.mjs
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('legacy-bridge.html','utf8');
          const scripts=[...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
          if(!scripts.length) throw new Error('Legacy bridge module script missing');
          fs.writeFileSync('/tmp/legacy-bridge.mjs',scripts.map(x=>x[1]).join('\n'));
          NODE
          node --check /tmp/legacy-bridge.mjs
      - name: Shared Notifications adoption
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8'),html=fs.readFileSync('index.html','utf8'),worker=fs.readFileSync('cloudflare-worker.js','utf8'),push=fs.readFileSync('firebase-messaging-sw.js','utf8');
          for(const event of ['snag.created','snag.updated','snag.comment_added','snag.status_changed']) if(!app.includes(event)||!worker.includes(event)) throw new Error('Missing notification event '+event);
          if(!app.includes('Apps/notifications/v1/index.js')) throw new Error('Shared Notifications SDK is not consumed');
          if(!html.includes('enableWebPushNotifications')) throw new Error('User notification activation control missing');
          if(!app.includes('registerWebPush')||!push.includes('firebase-messaging-compat.js')) throw new Error('FCM push activation missing');
          if(!worker.includes("scope==='policy'")||!worker.includes('Owner access required')) throw new Error('Owner notification policy enforcement missing');
          if(!worker.includes("notificationAllowed(policy,target,'channel',key)")||!worker.includes("notificationAllowed(policy,target,'event',key)")) throw new Error('Recipient policy ceiling missing');
          if(!app.includes('maybePresentNotificationChoice')||!app.includes('notificationPromptKey')) throw new Error('First-open notification choice missing');
          if(!app.includes('previewKey')||!app.includes('makePreviewFile')||!app.includes('backfillMediaPreviews')) throw new Error('Fast image preview workflow missing');
          if(!app.includes("cache:'default'")) throw new Error('Private media fetch still bypasses browser cache');
          console.log('Shared Notifications adoption invariants OK');
          NODE
      - name: Check central cloud configuration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('firebase-config.js','utf8');
          if(!cfg.includes("projectId: 'snag-509418'")) throw new Error('Dedicated Snag project is not primary');
          if(!cfg.includes("projectId: 'kk-syllabus'")) throw new Error('Legacy migration source missing');
          const wrangler=fs.readFileSync('wrangler.jsonc','utf8');
          if(!wrangler.includes('AIzaSyBnph6Ob5jhvJZMGvk1cpF0euno__aRtfU')) throw new Error('Media worker does not trust dedicated Snag Firebase');
          const lab=fs.readFileSync('version-lab.html','utf8');
          if(!lab.includes("loadCurrentText('firebase-config.js')")) throw new Error('Version Lab is not using central cloud config');
          console.log('Cloud config and Version Lab wiring look correct.');
          NODE
