name: One-time deploy App Monitor classification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-app-monitor-classification.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Apps
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          path: apps
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/package.json
      - name: Install dependencies
        working-directory: apps
        run: npm install --no-audit --no-fund
      - name: Deploy App Monitor
        working-directory: apps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-app-monitor.jsonc
      - name: Smoke test
        run: |
          curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health'
          echo
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/security/status'
          echo
