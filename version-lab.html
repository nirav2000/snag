<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Snag Version Lab</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:white}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}.bar a{color:white}.msg{padding:24px;max-width:680px;margin:auto}.launch{display:inline-block;background:white;color:#111827!important;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:700}</style></head><body><div class="bar"><strong id="title">Version Lab</strong><a href="./">Current development</a></div><div class="msg"><p>Archived versions are opened directly from their immutable GitHub snapshot, so the selected version cannot silently become the current app.</p><a id="launch" class="launch">Open selected version</a><p><small>Version Lab is for comparison. The stable branch is the version intended for real-world use.</small></p></div><script>
const p=new URLSearchParams(location.search),ref=p.get('ref')||'stable',build=p.get('build')||ref;
document.getElementById('title').textContent='Version Lab · '+build;

location.replace(u);
</script></body></html>
