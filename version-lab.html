<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Snag Version Lab</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:white}.labbar{position:fixed;z-index:999999;left:0;right:0;top:0;height:44px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px}.labbar a{color:white}.frame{padding-top:44px}iframe{width:100%;height:calc(100vh - 44px);border:0;background:white}</style></head><body><div class="labbar"><span id="labLabel">Loading archived Snag…</span><a href="./">Back to current</a></div><div class="frame"><iframe id="preview"></iframe></div><script>
(async()=>{
 const p=new URLSearchParams(location.search),ref=p.get('ref'),build=p.get('build')||ref;
 if(!ref){document.getElementById('labLabel').textContent='No version selected';return}
 document.getElementById('labLabel').textContent='Version Lab · '+build;
 const base='https://raw.githubusercontent.com/nirav2000/snag/'+encodeURIComponent(ref)+'/';
 const get=async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' unavailable');return r.text()};
 try{
  let [html,css,notesCss,cfg,app,notes]=await Promise.all([get('index.html'),get('styles.css'),get('notes.css'),get('firebase-config.js'),get('app.js'),get('notes.js')]);
  html=html.replace(/<link[^>]+href="styles\.css[^>]*>/,'<style>'+css+'</style>')
           .replace(/<link[^>]+href="notes\.css[^>]*>/,'<style>'+notesCss+'</style>')
           .replace(/<script[^>]+src="firebase-config\.js[^>]*><\/script>/,'<script>'+cfg+'<\/script>')
           .replace(/<script[^>]+type="module"[^>]+src="app\.js[^>]*><\/script>/,'')
           .replace(/<script[^>]+type="module"[^>]+src="notes\.js[^>]*><\/script>/,'')
           .replace(/<script>if\("serviceWorker"[\s\S]*?<\/script>/g,'')
           .replace(/<script>[\s\S]*?version\.json[\s\S]*?<\/script>/g,'');
  const appUrl=URL.createObjectURL(new Blob([app],{type:'text/javascript'}));
  const notesUrl=URL.createObjectURL(new Blob([notes],{type:'text/javascript'}));
  html=html.replace('</body>','<script type="module" src="'+appUrl+'"><\/script><script type="module" src="'+notesUrl+'"><\/script></body>');
  document.getElementById('preview').srcdoc=html;
 }catch(e){document.getElementById('labLabel').textContent='Could not load archived version · '+e.message}
})();
</script></body></html>
